[package]
name = "vpncloud"
version = "2.4.3"
authors = ["Dennis Schwerdel <schwerdel@googlemail.com>"]
license = "GPL-3.0"
description = "Peer-to-peer VPN"
homepage = "https://vpncloud.ddswd.de"
repository = "https://github.com/Lyamc/vpncloud"
keywords = ["vpn", "p2p", "tun", "tap", "network"]
readme = "README.md"
edition = "2021"

[lib]
name = "vpncloud"
# Host builds only need an rlib. Android/iOS scripts pass `--crate-type cdylib` /
# `staticlib` to rustc so JNI / Network Extension still get a shared/static lib.
crate-type = ["rlib"]

[package.metadata]
toolchain = "1.75.0"
upx_version = "4.2.2"

[dependencies]
chrono = { version = "0.4.45", features = [
    "std",
    "clock",
], default-features = false }
socket2 = "0.6.5"
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
toml = "0.8"
log = { version = "0.4.34", features = ["std"] }
signal-hook = "0.4.4"
rand = "0.10.2"

fnv = "1.0.7"
ring = "0.17.14"
aws-lc-rs = { version = "1", optional = true }
snow = { version = "0.10", optional = true, default-features = false, features = ["std", "default-resolver", "default-resolver-crypto"] }
x25519-dalek = { version = "2", optional = true, default-features = false, features = ["static_secrets"] }
byteorder = "1.5.0"
thiserror = "2.0.20"
smallvec = "1.15.2"
lazy_static = "1.5.0"
dialoguer = { version = "0.12.0", optional = true }
tungstenite = { version = "0.30.0", optional = true }
url = { version = "2.5.8", optional = true }
igd-next = { version = "0.17.1", optional = true }
mio = { version = "1.2.2", features = ["os-poll", "os-ext", "net"] }
tun-rs = "2.8.8"
getifaddrs = "0.6.2"
service-manager = { version = "0.11", optional = true }
# Software renderer only — wgpu is several MB and unused for this form.
# X11/Wayland are Linux/FreeBSD-only (see target-specific features below).
iced = { version = "0.14", optional = true, default-features = false, features = [
    "tiny-skia",
    "thread-pool",
    "basic-shaping",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
iced = { version = "0.14", optional = true, default-features = false, features = [
    "tiny-skia",
    "thread-pool",
    "basic-shaping",
    "x11",
    "wayland",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
privdrop = "0.5.6"

[target.'cfg(windows)'.dependencies]
service-manager = "0.11"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15"

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
iai = "0.1.1"

[features]
default = ["nat", "websocket", "wizard", "noise"]
nat = ["dep:igd-next"]
websocket = ["dep:tungstenite", "dep:url"]
wizard = ["dep:dialoguer"]
installer = ["dep:service-manager"]
gui = ["dep:iced"]
noise = ["dep:snow", "dep:x25519-dalek"]
# AES-GCM via AWS-LC instead of ring. Needs cmake. Noise still uses ring.
aws-lc = ["dep:aws-lc-rs"]

[[bin]]
name = "vpncloud-gui"
path = "src/bin/vpncloud-gui.rs"
required-features = ["gui"]

[[bench]]
name = "criterion"
harness = false

[[bench]]
name = "valgrind"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

# Fat LTO for packaged/static binaries (`cargo build --profile dist`).
[profile.dist]
inherits = "release"
lto = "fat"

[profile.dev]
lto = false
incremental = true

[profile.test]
lto = false

[package.metadata.deb]
extended-description = """\
 VpnCloud is a high performance peer-to-peer mesh VPN over UDP supporting strong encryption,
 NAT traversal and a simple configuration. It establishes a fully-meshed self-healing VPN
 network in a peer-to-peer manner with strong end-to-end encryption based on elliptic curve
 keys and AES-256. VpnCloud creates a virtual network interface on the host and forwards all
 received data via UDP to the destination. It can work on TUN devices (IP based) and TAP
 devices (Ethernet based)."""
license-file = ["LICENSE.md", "1"]
changelog = "assets/changelog.txt"
section = "net"
depends = "libc6 (>= 2.23), libgcc1 (>= 1:6.0.1)"
maintainer-scripts = "assets/deb-scripts"
assets = [
    [
        "target/release/vpncloud",
        "/usr/bin/vpncloud",
        "755",
    ],
    [
        "assets/example.net.disabled",
        "/etc/vpncloud/example.net.disabled",
        "600",
    ],
    [
        "assets/vpncloud@.service",
        "/lib/systemd/system/vpncloud@.service",
        "644",
    ],
    [
        "assets/vpncloud.target",
        "/lib/systemd/system/vpncloud.target",
        "644",
    ],
    [
        "assets/vpncloud-wsproxy.service",
        "/lib/systemd/system/vpncloud-wsproxy.service",
        "644",
    ],
    [
        "target/vpncloud.1.gz",
        "/usr/share/man/man1/vpncloud.1.gz",
        "644",
    ],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/vpncloud", dest = "/usr/bin/vpncloud", mode = "755" },
    { source = "assets/example.net.disabled", dest = "/etc/vpncloud/example.net.disabled", mode = "600" },
    { source = "assets/vpncloud@.service", dest = "/lib/systemd/system/vpncloud@.service", mode = "644" },
    { source = "assets/vpncloud.target", dest = "/lib/systemd/system/vpncloud.target", mode = "644" },
    { source = "assets/vpncloud-wsproxy.service", dest = "/lib/systemd/system/vpncloud-wsproxy.service", mode = "644" },
    { source = "target/vpncloud.1.gz", dest = "/usr/share/man/man1/vpncloud.1.gz", mode = "644" },
]
auto-req = "no"
